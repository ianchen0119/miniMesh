---
# ServiceAccount for the daemon DaemonSet
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minimesh-daemon
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minimesh-daemon
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minimesh-daemon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minimesh-daemon
subjects:
  - kind: ServiceAccount
    name: minimesh-daemon
    namespace: kube-system
---
# DaemonSet – one daemon per node (ambient-style, no sidecars)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: minimesh-daemon
  namespace: kube-system
  labels:
    app: minimesh-daemon
spec:
  selector:
    matchLabels:
      app: minimesh-daemon
  template:
    metadata:
      labels:
        app: minimesh-daemon
    spec:
      serviceAccountName: minimesh-daemon
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-cni
          image: busybox
          command: [sh, -c, "mkdir -p /run/minimesh"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: run
              mountPath: /run
      containers:
        - name: daemon
          image: minimesh/daemon:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN]
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # microk8s default Service CIDR. Override for other distros
            # (kubeadm: 10.96.0.0/12, kind: 10.96.0.0/16, GKE: 34.118.224.0/20).
            - name: SVC_CIDR
              value: "10.152.183.0/24"
            # Optional: pin POD_CIDR explicitly to skip K8s-API auto-detection.
            # - name: POD_CIDR
            #   value: "10.1.0.0/16"
          args:
            - --node-addr=$(NODE_IP)
            - --daemon-uid=1337
          envFrom: []
          volumeMounts:
            - name: run
              mountPath: /run
      volumes:
        - name: run
          hostPath:
            path: /run
